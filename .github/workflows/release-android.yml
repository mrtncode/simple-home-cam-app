name: Build Android APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK with EAS locally
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SimpleHomeCam
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SimpleHomeCam/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Build signed APK with EAS Build local
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile production --local --non-interactive --output ./release.apk

      - name: Attach APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: SimpleHomeCam/release.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleHomeCam-${{ github.event.release.tag_name }}.apk
          path: SimpleHomeCam/release.apk
          if-no-files-found: error
